<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="Shop printed books, enquire and order online."><title>Enquiry | Your Brand</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><div class="brand-mark">▰</div><div class="brand-text"><strong class="brand-name">Your Brand</strong><span class="tagline">Books for a Better Tomorrow</span></div></a><nav class="nav-links"><a href="index.html">Books</a><a href="gallery.html">Gallery</a><a class="active" href="enquiry.html">Enquiry</a></nav><div class="nav-spacer"></div><a class="icon-btn" href="cart.html">🛒<span class="cart-count">0</span></a></div></header><main class="page"><div class="container enquiry-wrap"><div class="panel"><h1 style="font:700 45px Georgia,serif">Send an <span class="accent">Enquiry</span></h1><p class="meta">Ask about books, bulk orders, availability or anything else.</p><form id="enquiryForm"><div class="row"><div class="field"><label>Name *</label><input class="input" name="name" required></div><div class="field"><label>Mobile *</label><input class="input" name="phone" required></div></div><div class="field"><label>Email</label><input class="input" type="email" name="email"></div><div class="field"><label>Message *</label><textarea class="textarea" rows="6" name="message" required></textarea></div><button class="btn btn-gold" type="submit">Send Enquiry</button></form><div id="enqSuccess" class="notice hidden" style="margin-top:14px">Enquiry received. We will get back to you.</div></div><div class="panel" style="margin-top:18px"><h3>Quick Contact</h3><div class="location-block"><strong class="location-label">Our Store Location</strong><div class="location-text" style="margin-top:6px"></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-primary whatsapp" href="#">WhatsApp</a><a class="btn btn-light phone" href="#">Call</a><a class="btn btn-light location" href="#">Location</a></div></div></div></main><div class="toast"></div><script src="data.js"></script><script src="app.js"></script><script>trackEvent('enquiry_view',{page:location.pathname});</script><script>document.querySelector('#enquiryForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const a=JSON.parse(localStorage.getItem('bookEnquiries')||'[]');a.push({...Object.fromEntries(fd.entries()),date:new Date().toLocaleString('en-IN')});localStorage.setItem('bookEnquiries',JSON.stringify(a)); trackEvent('enquiry_sent');e.target.reset();document.querySelector('#enqSuccess').classList.remove('hidden');};</script><nav class="mobile-bottom-nav" aria-label="Mobile navigation"><a href="index.html">🏠<span>Home</span></a><a href="index.html#books">📚<span>Books</span></a><a href="cart.html">🛒<span>Cart</span></a><a href="enquiry.html">💬<span>Enquiry</span></a><a href="index.html#contact">📍<span>Contact</span></a></nav><script>document.addEventListener("DOMContentLoaded",()=>{const c=document.querySelector(".cart-count");if(c){try{const a=JSON.parse(localStorage.getItem("bookCart")||"[]");c.textContent=a.reduce((n,x)=>n+Number(x.qty||0),0)}catch{}}});</script></body></html>
