<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Your Brand</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><div class="brand-mark">▰</div><div class="brand-text"><strong class="brand-name">Your Brand</strong><span class="tagline">Books for a Better Tomorrow</span></div></a><nav class="nav-links"><a href="index.html">Books</a><a href="cart.html">Cart</a></nav><div class="nav-spacer"></div><a class="icon-btn" href="cart.html">🛒<span class="cart-count">0</span></a></div></header><main class="page"><div class="container"><div class="section-head"><div><div class="meta">Cart › Checkout</div><h1 style="font:700 45px Georgia,serif;margin:8px 0">Check<span class="accent">out</span></h1><p class="meta">Complete your order securely and get your books delivered.</p></div></div><form id="checkoutForm"><div class="two-col"><div><div class="panel"><h2>Shipping Information</h2><div class="row"><div class="field"><label>Full Name *</label><input class="input" name="name" required></div><div class="field"><label>Mobile Number *</label><input class="input" name="phone" required></div></div><div class="field"><label>Email Address</label><input class="input" type="email" name="email"></div><div class="field"><label>Address *</label><textarea class="textarea" name="address" rows="4" required></textarea></div><div class="row"><div class="field"><label>City *</label><input class="input" name="city" required></div><div class="field"><label>State *</label><input class="input" name="state" required></div></div><div class="field"><label>Pincode *</label><input class="input" name="pincode" required></div></div><div class="panel"><h2>Select Payment Method</h2><label class="filter-option"><input type="radio" name="payment" value="UPI" checked> UPI (Google Pay, PhonePe, Paytm)</label><label class="filter-option"><input type="radio" name="payment" value="Card"> Credit / Debit Card</label><label class="filter-option"><input type="radio" name="payment" value="Net Banking"> Net Banking</label><label class="filter-option"><input type="radio" name="payment" value="Wallet"> Wallets</label><label class="filter-option"><input type="radio" name="payment" value="COD"> Cash on Delivery</label><div class="notice" style="margin-top:14px">Demo payment UI only. Razorpay will be added after testing.</div></div></div><aside class="panel"><div id="checkoutSummary"></div><button class="btn btn-gold" id="payBtn" style="width:100%;margin-top:14px" type="submit">Pay Securely</button></aside></div></form></div></main><div class="toast"></div><script src="data.js"></script><script src="app.js"></script></body></html>
