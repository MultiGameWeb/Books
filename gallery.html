<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gallery | Your Brand</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><div class="brand-mark">▰</div><div class="brand-text"><strong class="brand-name">Your Brand</strong><span class="tagline">Books for a Better Tomorrow</span></div></a><nav class="nav-links"><a href="index.html">Books</a><a class="active" href="gallery.html">Gallery</a><a href="enquiry.html">Enquiry</a></nav><div class="nav-spacer"></div><a class="icon-btn" href="cart.html">🛒<span class="cart-count">0</span></a></div></header><main class="page"><div class="container"><h1 style="font:700 46px Georgia,serif">Our <span class="accent">Gallery</span></h1><p class="meta">Book covers, collections and reading moments.</p><div id="galleryGrid" class="gallery-grid" style="margin-top:24px"></div></div></main><script src="data.js"></script><script>ensureStore();const g=document.querySelector('#galleryGrid');g.innerHTML=getStore().gallery.map(x=>`<article class="card gallery-card"><div class="gallery-image">${x.image?`<img src="${x.image}" alt="${x.title}">`:'📚'}</div><div style="padding:15px"><h3 style="margin:0 0 6px">${x.title}</h3><p class="meta" style="margin:0">${x.caption||''}</p></div></article>`).join('');</script></body></html>
